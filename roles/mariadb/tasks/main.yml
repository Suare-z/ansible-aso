---
- name: Instalar MariaDB
  ansible.builtin.zypper:
    name:
      - mariadb
      - mariadb-client
    state: present

- name: Habilitar e iniciar MariaDB
  ansible.builtin.systemd:
    name: mariadb
    enabled: yes
    state: started

- name: Fijar contraseña de root (mantiene acceso por socket)
  ansible.builtin.command:
    argv:
      - mysql
      - -e
      - "ALTER USER 'root'@'localhost' IDENTIFIED VIA unix_socket OR mysql_native_password USING PASSWORD('{{ mariadb_root_password }}');"
  changed_when: false
  no_log: true

- name: Crear base de datos de ejemplo
  ansible.builtin.command:
    argv:
      - mysql
      - -e
      - "CREATE DATABASE IF NOT EXISTS appdb CHARACTER SET utf8mb4;"
  changed_when: false
