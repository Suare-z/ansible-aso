---
- name: Instalar Samba
  ansible.builtin.zypper:
    name: samba
    state: present

- name: Crear usuario del sistema
  ansible.builtin.user:
    name: "{{ samba_user }}"
    shell: /sbin/nologin
    create_home: no
    password: "{{ system_user_password | password_hash('sha512') }}"
    update_password: on_create

- name: Crear directorio compartido
  ansible.builtin.file:
    path: "{{ samba_share_path }}"
    state: directory
    owner: "{{ samba_user }}"
    group: users
    mode: '0775'

- name: Configurar smb.conf (con create mask)
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    backup: yes
    validate: 'testparm -s %s'
  notify: Reiniciar samba

- name: Ver si el usuario Samba ya existe
  ansible.builtin.shell: "pdbedit -L | grep -q '^{{ samba_user }}:'"
  register: samba_user_exists
  changed_when: false
  failed_when: false

- name: Crear usuario Samba
  ansible.builtin.shell: "printf '%s\\n%s\\n' '{{ samba_user_password }}' '{{ samba_user_password }}' | smbpasswd -a -s {{ samba_user }}"
  when: samba_user_exists.rc != 0
  no_log: true

- name: Permitir a Samba escribir en el directorio (SELinux)
  ansible.posix.seboolean:
    name: samba_export_all_rw
    state: yes
    persistent: yes

- name: Habilitar e iniciar smb y nmb
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - smb
    - nmb

- name: Abrir Samba en el firewall
  ansible.posix.firewalld:
    service: samba
    permanent: yes
    immediate: yes
    state: enabled
